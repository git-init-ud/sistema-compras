services:
  compra-api:
    build:
      context: ./compra-api
      dockerfile: dockerfile
    container_name: compra-api
    ports:
      - "3003:3003"
    environment:
      CLIENTE_API_URL: http://cliente-api:3001
      PRODUCTO_API_URL: http://producto-api:3002
    networks:
      - compra-network
  producto-api:
    build:
      context: ./producto-api
      dockerfile: dockerfile
    container_name: producto-api
    ports:
      - "3002:3002"
    environment:
      COMPRA_API_URL: http://compra-api:3003
    networks:
      - compra-network
  cliente-api:
    build:
      context: ./cliente-api
      dockerfile: dockerfile
    container_name: cliente-api
    ports:
      - "3001:3001"
    environment:
      COMPRA_API_URL: http://compra-api:3003
    networks:
      - compra-network

networks:
  compra-network:
    driver: bridge
