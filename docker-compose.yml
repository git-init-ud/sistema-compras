services:
  compra-api:
    build:
      context: ./compra-api
      dockerfile: dockerfile
    container_name: compra-api
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      CLIENTE_API_URL: http://cliente-api:3001
      PRODUCTO_API_URL: http://producto-api:3002
    networks:
      - compra-network
  producto-api:
    build:
      context: ./producto-api
      dockerfile: dockerfile
    container_name: producto-api
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      COMPRA_API_URL: http://compra-api:3003
    networks:
      - compra-network
  cliente-api:
    build:
      context: ./cliente-api
      dockerfile: dockerfile
    container_name: cliente-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      COMPRA_API_URL: http://compra-api:3003
    networks:
      - compra-network
  nginx:
    image: nginx:alpine
    container_name: sistema-compras-nginx
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - cliente-api
      - producto-api
      - compra-api
    networks:
      - compra-network

networks:
  compra-network:
    driver: bridge
